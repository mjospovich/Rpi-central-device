[agent]
  interval = "10s"
  flush_interval = "10s"

# ChirpStack → Node-RED → normalized JSON on nodered/lorawan/*
[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]
  topics = ["nodered/lorawan/#"]
  client_id = "telegraf_chirpstack"
  data_format = "json"
  json_name_key = "measurement"
  json_time_key = "time_gmt2"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  json_string_fields = ["illumination", "sensor_type", "alarm_fields"]
  tag_keys = ["dev_eui", "device_name", "sensor_name", "sensor_type"]

# Optional: devices named zigbee_network_* get a duplicate stream as lora_rpi_edge (see Node-RED function)
[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]
  topics = ["nodered/lorawan_edge"]
  client_id = "telegraf_lora_edge"
  data_format = "json"
  json_name_key = "measurement"
  json_time_key = "time_gmt2"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  json_string_fields = ["illumination", "sensor_type", "alarm_fields", "original_measurement"]
  tag_keys = ["dev_eui", "device_name", "sensor_name", "sensor_type"]

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
